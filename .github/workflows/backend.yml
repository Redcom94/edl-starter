name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:            # aussi sur les pull requests (indispensable à l'exercice 4)
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip' # caching pip dependencies
      - run: pip install uv
      - run: cd backend && uv sync && uv run pytest -v --cov

